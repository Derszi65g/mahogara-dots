[system]
sys_adapter = ACAD
sys_battery = BAT1
sys_graphics_card = intel_backlight
sys_network_interface = wlan0

[module-base]
format-background = ${colors.background-alt}
format-padding = 1
format-margin = 0

[module/date]
inherit = module-base
type = internal/date
interval = 1.0
date = %Y-%m-%d%
time = %H:%M
date-alt = %A, %d %B %Y
time-alt = %A %b %d, %G
format = <label>
label = %time%
label-font = 1

[module/volume]
type=internal/pulseaudio
use-ui-max=false
interval=1
format-volume=<ramp-volume><bar-volume><label-volume>
format-volume-background=${colors.background-alt}
format-volume-padding=2
ramp-volume-0 ="  " 
ramp-volume-foreground=${colors.primary}
label-volume = "%percentage%%"
format-muted=<label-muted><bar-volume>
format-muted-background=${colors.background-alt}
format-muted-padding=2
label-muted="MUTE "
label-muted-foreground=${colors.red}

bar-volume-format = %fill%%empty%
bar-volume-width = 10
bar-volume-gradient = true
bar-volume-indicator = ""
bar-volume-fill = "━"
bar-volume-empty = "━"
bar-volume-empty-background= ${colors.background-alt}
bar-volume-fill-background = ${colors.background-alt}
bar-volume-indicator-background= ${colors.background-alt}
bar-volume-empty-foreground = ${colors.gray2}
bar-volume-fill-foreground = ${colors.primary}
bar-volume-indicator-foreground = ${colors.primary}
bar-volume-fill-font = 3
bar-volume-empty-font = 3

[module/battery]
inherit = module-base
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.primary}
format-charging-background = ${colors.background-alt}
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.background-alt}
format-discharging-padding = 1
format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.primary}
format-full-background = ${colors.background-alt}
format-full-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 =" "
ramp-capacity-1 =" "
ramp-capacity-2 =" "
ramp-capacity-3 =" "
ramp-capacity-4 =" "
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-font = 2

animation-charging-0 =" "
animation-charging-1 =" "
animation-charging-2 =" "
animation-charging-3 =" "
animation-charging-4 =" "
animation-charging-foreground = ${colors.primary}
animation-charging-font = 2
animation-charging-framerate = 700

[module/cpu]
inherit = module-base
type = internal/cpu
interval = 0.5
format = <label>
format-prefix = ""
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = " %percentage%%"

[module/backlight]
inherit = module-base
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
format-padding = 1
scroll-interval = 1

[module/tray]
type = internal/tray
format-background = ${colors.background-alt}
tray-background = ${colors.background-alt}
format-padding = 1
tray-padding = 0
tray-spacing = 8
tray-size = 16

[module/launcher]
inherit = module-base
type=custom/text
format=󱘊
format-font=1
format-foreground= ${colors.primary}
format-padding=2
click-left=rofi -show 
click-right=rofi -show run

[module/cpu-temperature]
inherit = module-base
type=internal/temperature
interval=1
hwmon-path = ${env:HWMON_PATH}
base-temperature=0
warn-temperature=90
format-prefix="󰴈 "
format-prefix-foreground=${colors.primary}
format-warn = <label-warn>
format-warn-prefix="󰴈 "
format-warn-prefix-foreground=${colors.red}
format-warn-background = ${colors.background-alt}
label-font=1
label-warn-font=1
